<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>敦煌 · 千年一瞬</title>
  <link rel="stylesheet" href="style.css">
  <style>
    
    .splash {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), 
                  url('images/guide-background.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--dunhuang-yellow);
      text-align: center;
    }
    
    .splash h1 {
      font-family: "DunHuangFont", serif;
      font-size: 4.5rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px #000;
    }
    .splash p {
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }
    .btn {
      padding: 1rem 2.5rem;
      background: var(--dunhuang-red);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: var(--dunhuang-blue);
    }
  </style>
</head>
<body>
  <section class="splash">
    <h1>敦 煌</h1>
    <p>大漠黄沙 · 千年壁画 · 丝路文明</p>
    <a href="index.html" class="btn">进入秘境</a>
  </section>
</body>
</html>
